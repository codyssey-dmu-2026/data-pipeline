name: Collect news

# 한국경제 RSS는 카테고리당 최신 50건(약 12~14시간 분량)만 주므로, 6시간마다 돌려야
# 빠지는 기사 없이 누적된다. DART·SEC는 매번 전체 이력을 다시 받고 URL로 중복 제거한다.
on:
  schedule:
    - cron: "23 */6 * * *" # 정각은 GitHub 러너가 붐벼 지연되므로 23분에 실행
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect news and disclosures
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_EDGAR_CONTACT_EMAIL: ${{ secrets.SEC_EDGAR_CONTACT_EMAIL }}
        run: |
          python collect_news.py 2>&1 | tee collect.log
          # collect_all()은 소스별 실패를 로그만 남기고 넘어가므로, 실행 화면에 경고로 드러낸다.
          if grep -q "Failed to collect" collect.log; then
            echo "::warning::일부 소스 수집 실패. 'Collect news and disclosures' 로그를 확인한다."
          fi

      - name: Commit new rows
        run: |
          git add data/raw/news
          if git diff --cached --quiet; then
            echo "새로 수집된 행이 없다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: collect news $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
